# Netlify builds main on every push (Git integration; no secrets needed).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# www and the Netlify subdomain redirect to the apex (also set "Primary domain" to ilmvanta.com in Netlify).
[[redirects]]
  from = "https://www.ilmvanta.com/*"
  to = "https://ilmvanta.com/:splat"
  status = 301
  force = true
